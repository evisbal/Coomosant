<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verificación de afiliado — Coomosant</title>
<meta name="robots" content="noindex, follow"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Open Sans', sans-serif; }
  a { color: #0a97b0; text-decoration: none; }
  a:hover { color: #065968; }
  @keyframes cm-pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  #app { min-height: 100vh; background: #eef3f4; }
  .skeleton { max-width: 460px; margin: 32px auto; padding: 0 16px; text-align: center; color: #5a6b7a; font-size: 14px; }
</style>

<!-- Supabase JS + config + cliente -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabase-client.js"></script>
</head>
<body>

<div id="app">
  <header style="background:#04233b;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #0a97b0;flex-wrap:wrap;gap:10px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="assets/logo.png" alt="Coomosant" style="width:40px;height:40px;object-fit:contain;" />
      <div>
        <p style="font-weight:800;font-size:18px;color:#fff;margin:0;line-height:1.1;text-transform:uppercase;">Coomosant</p>
        <p style="font-size:12px;color:#8fd7e2;margin:0;">Verificación de afiliado</p>
      </div>
    </div>
    <a href="index.html" style="background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.35);border-radius:4px;padding:11px 16px;font-size:13px;font-weight:700;text-transform:uppercase;">← Inicio</a>
  </header>

  <main id="contenido" class="skeleton">Cargando…</main>
</div>

<script type="module">
  import { getAfiliadoByCedula, qrDataUrl, tipoLabel, fmtCedula } from './assets/js/store.js';
  import { tema, cardHtml } from './assets/js/credential-card.js';

  function render(html) {
    document.getElementById('contenido').outerHTML = html;
  }

  // Escapa texto dinámico antes de insertarlo en innerHTML/outerHTML — evita
  // que nombres, mensajes de error, etc. rompan el markup si contienen < > & " '.
  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function renderDemo() {
    render(`
      <main class="skeleton" style="max-width:460px;text-align:left;">
        <div style="margin-top:28px;background:#FFFFFF;border-radius:4px;padding:18px 20px;border:1px dashed #b7c2c8;">
          <p style="font-family:monospace;font-size:12px;color:#0a97b0;margin:0 0 10px;">// escribe una cédula para verificar, o probá:</p>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <a href="?cc=1085234567" style="font-size:13px;">Ejemplo — afiliado activo</a>
            <a href="?cc=0000000000" style="font-size:13px;">Ejemplo — no existe</a>
          </div>
        </div>
      </main>`);
  }

  function renderNotFound() {
    render(`
      <main class="skeleton" style="max-width:460px;">
        <div style="background:#FFFFFF;border-radius:6px;overflow:hidden;box-shadow:0 8px 32px rgba(4,35,59,0.18);text-align:center;padding:48px 28px;">
          <span style="font-size:56px;display:block;margin-bottom:16px;">❓</span>
          <h2 style="font-weight:800;font-size:24px;color:#04233b;margin:0 0 12px;text-transform:uppercase;">Este carnet no está registrado</h2>
          <p style="font-size:15px;color:#333333;line-height:1.6;margin:0 0 24px;">No encontramos ningún afiliado con este código. Si un domiciliario o mototaxista te muestra este carnet, <strong>no confíes en él</strong> y repórtalo a Coomosant.</p>
          <a href="index.html" style="background:#0a97b0;color:#fff;border-radius:4px;padding:14px 28px;font-weight:700;text-decoration:none;font-size:14px;text-transform:uppercase;display:inline-block;">Volver al inicio</a>
        </div>
      </main>`);
  }

  function renderError(msg) {
    render(`<main class="skeleton">⚠️ ${esc(msg)}</main>`);
  }

  async function renderAfiliado(afiliado) {
    document.getElementById('app').style.background = tema(afiliado.estado).bg;

    let qrHtml = '<span style="font-size:11px;color:#5a6b7a;">QR no disponible</span>';
    try {
      const qr = await qrDataUrl(afiliado.cedula);
      qrHtml = `<img src="${qr}" alt="Código QR del afiliado" style="width:100%;height:100%;object-fit:contain;" />`;
    } catch (e) {
      console.warn(e);
    }

    render(`
      <main class="skeleton" style="max-width:460px;text-align:center;">
        ${cardHtml(afiliado, qrHtml, fmtCedula, tipoLabel)}
        <p style="text-align:center;margin-top:24px;font-size:13px;color:#5a6b7a;">
          Página oficial de verificación · Santa Marta, Magdalena
        </p>
      </main>`);
  }

  async function init() {
    const params = new URLSearchParams(location.search);
    const cc = params.get('cc');
    if (!cc) { renderDemo(); return; }
    try {
      const afiliado = await getAfiliadoByCedula(cc);
      if (!afiliado) { renderNotFound(); return; }
      await renderAfiliado(afiliado);
    } catch (e) {
      console.error(e);
      renderError(e.message || 'No se pudo consultar el afiliado.');
    }
  }

  init();
</script>
</body>
</html>
